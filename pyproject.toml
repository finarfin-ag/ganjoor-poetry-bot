[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ganjoor-poetry-bot"
version = "0.1.0"
description = "Local-first Persian poetry search core and Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "finarfin-ag"}]
dependencies = [
    "python-telegram-bot>=22.8,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ganjoor-telegram = "ganjoor_bot.telegram_bot:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
